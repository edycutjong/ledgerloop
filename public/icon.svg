<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient with Dynamic Variable and Hex Fallback -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--primary, #06B6D4)"/>
      <stop offset="100%" stop-color="var(--accent, #10B981)"/>
    </linearGradient>

    <!-- Inner Glow/Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Node Glow Filter -->
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="none"/>

  <!-- Rotating Tanda Wheel (Dashed for rotation steps) -->
  <circle 
    cx="256" 
    cy="256" 
    r="170" 
    fill="none" 
    stroke="url(#brand-grad)" 
    stroke-width="24" 
    stroke-linecap="round"
    stroke-dasharray="160 40 160 40"
    filter="url(#glow)"
    opacity="0.9"
    transform="rotate(15 256 256)"
  />

  <!-- Inner Concentric Support Ring -->
  <circle 
    cx="256" 
    cy="256" 
    r="120" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.05)" 
    stroke-width="6" 
    stroke-dasharray="10 15"
  />

  <!-- Central Escrow Vault Lock Symbol (Geometric) -->
  <polygon 
    points="256,180 320,244 320,312 192,312 192,244" 
    fill="rgba(11, 15, 25, 0.8)" 
    stroke="url(#brand-grad)" 
    stroke-width="12" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <circle cx="256" cy="246" r="16" fill="#06B6D4" filter="url(#node-glow)" />

  <!-- Outer Participant Connection Nodes (glowing points) -->
  <circle cx="256" cy="86" r="12" fill="#10B981" filter="url(#node-glow)" />
  <circle cx="256" cy="426" r="12" fill="#10B981" filter="url(#node-glow)" />
  <circle cx="86" cy="256" r="12" fill="#06B6D4" filter="url(#node-glow)" />
  <circle cx="426" cy="256" r="12" fill="#06B6D4" filter="url(#node-glow)" />
</svg>
